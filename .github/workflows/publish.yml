name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Runs the gates alone, without an upload, to check them off a tag.
  workflow_dispatch:

jobs:
  gates:
    uses: NaNIsaac/.github/.github/workflows/publish-gates.yml@284b0786020434df16b096a3e11c56c6331dd81f
    permissions:
      contents: read
    with:
      import-name: reflectofit

  publish:
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check tag matches pyproject version
        run: |
          VERSION=$(uv version --short)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
      # The files the gates checked, not a new build
      - uses: actions/download-artifact@v8
        with:
          name: publish-gates-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
