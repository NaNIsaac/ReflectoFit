# Starting guess for fitting film.dat: the film's values are off, the oxide is fixed.

[instrument]
wavelength = 1.5406
i0 = 1.0
background = 1e-7
sigma_q = 5e-4
sample_length = 10.0
beam_sigma = 0.04

[[layer]]
name = "film"
sld = [40.0, 1.5]
thickness = 250.0
roughness = 4.0

[[layer]]
name = "oxide"
material = "SiO2"
density = 2.20
thickness = 12.0
roughness = 3.0

[substrate]
material = "Si"
density = 2.33
roughness = 3.0

[fit]
"film.thickness" = [150.0, 350.0]
"film.roughness" = [0.5, 15.0]
"film.sld" = [20.0, 80.0]
i0 = [0.5, 2.0]
log10_background = [-10.0, -5.0]
