[project]
name = "reflectofit"
version = "0.1.0.dev0"
description = "X-ray reflectivity fitting engine and command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
keywords = ["x-ray reflectivity", "XRR", "thin films", "parratt", "fitting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "reflectosim",
]

[project.optional-dependencies]
torch = ["reflectosim[torch]"]
mcmc = ["emcee>=3.1"]

[project.scripts]
reflectofit = "reflectofit.cli:main"

[project.urls]
Homepage = "https://github.com/NaNIsaac/ReflectoFit"
Repository = "https://github.com/NaNIsaac/ReflectoFit"
Issues = "https://github.com/NaNIsaac/ReflectoFit/issues"
Changelog = "https://github.com/NaNIsaac/ReflectoFit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "torch>=2.5",
    "emcee>=3.1",
]

# CPU torch wheels for this project's own lock (tests, CI); installs from PyPI are not affected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# reflectosim is not on PyPI yet: pinned to a commit until its first release.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
reflectosim = { git = "https://github.com/NaNIsaac/ReflectoSim", rev = "d2f2119ddc9118c9c8c28acde7fadae8f1aff539" }

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
