[project]
name = "reflectofit"
version = "0.1.0.dev0"
description = "X-ray reflectivity fitting engine and command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
keywords = ["x-ray reflectivity", "XRR", "thin films", "parratt", "fitting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "scipy>=1.13",
]

[project.optional-dependencies]
torch = ["torch>=2.5"]

[project.scripts]
reflectofit = "reflectofit.cli:main"

[project.urls]
Homepage = "https://github.com/NaNIsaac/ReflectoFit"
Repository = "https://github.com/NaNIsaac/ReflectoFit"
Issues = "https://github.com/NaNIsaac/ReflectoFit/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "refnx>=0.1.60",
    "jax>=0.4.30",
    "torch>=2.5",
]

# CPU torch wheels for this project's own lock (tests, CI); installs from PyPI are not affected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# verbatim copies of other engines, compared against in tests/test_reference_engines.py
extend-exclude = ["tests/reference/reflectolearn_abeles.py"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
